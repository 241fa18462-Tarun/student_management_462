<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for crisp iconography -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
        theme: {
          bg: '#081426',        /* Deep Midnight Navy */
          card: '#142A44',      /* Slate Navy */
          cardDark: '#0D1E33',  /* Deeper Slate */
          primary: '#4A74A7',   /* Vibrant Steel Blue */
          accent: '#6392ce',    /* Lighter accent */
          light: '#DCEAF7',     /* Ice Blue highlight & text */
          muted: '#8ba6c6',     /* Soft secondary text */
        }
      },
          boxShadow: {
            'glow-primary': '0 0 20px -3px rgba(74, 116, 167, 0.45)',
            'glow-accent': '0 0 25px 2px rgba(99, 146, 206, 0.35)',
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)'
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #081426;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e3a5f;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4A74A7;
    }

    /* Ambient dynamic glow background */
    .bg-mesh-glow {
      background-color: #081426;
      background-image: 
        radial-gradient(at 0% 0%, rgba(74, 116, 167, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 10%, rgba(99, 146, 206, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(20, 42, 68, 0.6) 0px, transparent 65%);
    }

    /* Smooth backdrop glass blur */
    .glass-card {
      background: rgba(20, 42, 68, 0.68);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(220, 234, 247, 0.12);
    }
    
    .glass-input {
      background: rgba(8, 20, 38, 0.75);
      border: 1px solid rgba(74, 116, 167, 0.35);
      color: #DCEAF7;
      transition: all 0.25s ease;
    }
    .glass-input:focus {
      border-color: #4A74A7;
      box-shadow: 0 0 0 3px rgba(74, 116, 167, 0.3);
      outline: none;
    }

    /* Custom select arrow styling */
    select.glass-input {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23DCEAF7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.85rem center;
      background-size: 1.1em;
      padding-right: 2.5rem;
    }
  </style>
</head>
<body class="bg-theme-bg bg-mesh-glow text-theme-light min-h-screen flex flex-col antialiased selection:bg-theme-primary selection:text-white relative">

  <!-- MAIN VIEWPORT CONTAINER (Full-width & Centered) -->
  <main class="flex-1 flex flex-col p-4 sm:p-6 lg:p-10 max-w-6xl mx-auto w-full space-y-7">

    <!-- Top Header Bar (Cleaned up, no profile or settings cog) -->
    <header class="flex items-center space-x-4 pb-4 border-b border-theme-primary/20">
      <div class="w-13 h-13 sm:w-14 sm:h-14 p-3 rounded-2xl bg-gradient-to-tr from-theme-card to-theme-primary flex items-center justify-center shadow-glow-primary border border-theme-primary/40">
        <i class="fa-solid fa-graduation-cap text-2xl sm:text-3xl text-theme-light"></i>
      </div>
      <div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight flex items-center gap-2">
          Student <span class="text-theme-primary font-bold">Management</span>
        </h2>
        <p class="text-xs sm:text-sm text-theme-muted font-normal mt-0.5">Manage your students easily and efficiently</p>
      </div>
    </header>

    <!-- FORM SECTION: Dynamic Add / Edit Student Form -->
    <section id="formSection" class="glass-card rounded-2xl p-5 sm:p-7 shadow-glass relative transition-all duration-300">
      <div class="flex items-center space-x-3 mb-5">
        <div id="formIconContainer" class="w-8 h-8 rounded-lg bg-theme-primary/30 flex items-center justify-center text-theme-light">
          <i id="formIcon" class="fa-solid fa-user-plus text-sm"></i>
        </div>
        <h3 id="formTitle" class="text-base sm:text-lg font-bold text-white tracking-wide">Add New Student</h3>
      </div>

      <form id="studentForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-4 items-center">
        <!-- Hidden input for tracking edited student ID -->
        <input type="hidden" id="editingStudentId" value="">

        <!-- Student Name -->
        <div class="lg:col-span-4 relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted">
            <i class="fa-regular fa-user text-sm"></i>
          </div>
          <input 
            type="text" 
            id="studentName" 
            placeholder="Name..." 
            required 
            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-sm placeholder:text-theme-muted/60"
          />
        </div>

        <!-- Student Age -->
        <div class="lg:col-span-3 relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted">
            <i class="fa-regular fa-calendar text-sm"></i>
          </div>
          <input 
            type="number" 
            id="studentAge" 
            placeholder="Age..." 
            min="14" 
            max="99" 
            required 
            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-sm placeholder:text-theme-muted/60"
          />
        </div>

        <!-- Course Selector -->
        <div class="lg:col-span-3 relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted">
            <i class="fa-solid fa-book-bookmark text-sm"></i>
          </div>
          <select 
            id="studentCourse" 
            required 
            class="glass-input w-full pl-10 pr-4 py-3 rounded-xl text-sm"
          >
            <option value="" disabled selected class="bg-[#081426] text-theme-muted">Course...</option>
            <option value="B.Tech" class="bg-[#081426] text-white">B.Tech</option>
            <option value="MCA" class="bg-[#081426] text-white">MCA</option>
            <option value="B.Sc" class="bg-[#081426] text-white">B.Sc</option>
            <option value="BBA" class="bg-[#081426] text-white">BBA</option>
            <option value="M.Tech" class="bg-[#081426] text-white">M.Tech</option>
            <option value="MBA" class="bg-[#081426] text-white">MBA</option>
          </select>
        </div>

        <!-- Action Button Area: Default Submit vs Edit (Update & Cancel) -->
        <div id="defaultActionContainer" class="lg:col-span-2">
          <button 
            type="submit" 
            class="w-full py-3 px-5 rounded-xl bg-theme-primary hover:bg-theme-accent text-white font-semibold text-sm flex items-center justify-center space-x-2 shadow-glow-primary transition-all duration-200 active:scale-95"
          >
            <i class="fa-solid fa-paper-plane text-xs"></i>
            <span>Submit</span>
          </button>
        </div>

        <!-- Edit Action Buttons Container (Hidden by default) -->
        <div id="editActionContainer" class="hidden lg:col-span-2 flex items-center gap-2">
          <button 
            type="submit" 
            class="flex-1 py-3 px-3 rounded-xl bg-theme-primary hover:bg-theme-accent text-white font-semibold text-xs flex items-center justify-center space-x-1.5 shadow-glow-primary transition-all duration-200 active:scale-95"
          >
            <i class="fa-solid fa-check text-xs"></i>
            <span>Update</span>
          </button>
          <button 
            type="button" 
            id="cancelEditBtn" 
            class="flex-1 py-3 px-3 rounded-xl bg-theme-cardDark hover:bg-[#1a3454] border border-theme-primary/40 text-theme-light font-medium text-xs flex items-center justify-center space-x-1.5 transition-all duration-200 active:scale-95"
          >
            <i class="fa-solid fa-xmark text-xs"></i>
            <span>Cancel</span>
          </button>
        </div>
      </form>
    </section>

    <!-- TABLE SECTION: List of Students -->
    <section id="tableSection" class="glass-card rounded-2xl p-5 sm:p-7 shadow-glass flex flex-col space-y-5">
      <!-- Section Header with Search & Filter (Export CSV removed) -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
        <!-- Title -->
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-lg bg-theme-primary/30 flex items-center justify-center text-theme-light">
            <i class="fa-solid fa-list text-sm"></i>
          </div>
          <h3 class="text-base sm:text-lg font-bold text-white tracking-wide">List of Students</h3>
        </div>

        <!-- Toolbar: Search + Filter -->
        <div class="flex flex-wrap sm:flex-nowrap items-center gap-3">
          <!-- Search Input -->
          <div class="relative flex-1 sm:w-64">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-theme-muted">
              <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </div>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Search students..." 
              class="glass-input w-full pl-9 pr-3 py-2 text-xs rounded-xl"
            />
          </div>

          <!-- Course Filter Dropdown -->
          <div class="relative w-40">
            <select id="courseFilter" class="glass-input w-full py-2 pl-3 pr-8 text-xs rounded-xl">
              <option value="ALL" class="bg-[#081426] text-white">All Courses</option>
              <option value="B.Tech" class="bg-[#081426] text-white">B.Tech</option>
              <option value="MCA" class="bg-[#081426] text-white">MCA</option>
              <option value="B.Sc" class="bg-[#081426] text-white">B.Sc</option>
              <option value="BBA" class="bg-[#081426] text-white">BBA</option>
              <option value="M.Tech" class="bg-[#081426] text-white">M.Tech</option>
              <option value="MBA" class="bg-[#081426] text-white">MBA</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Table Container -->
      <div class="overflow-x-auto rounded-xl border border-theme-primary/20">
        <table class="w-full text-left text-sm border-collapse min-w-[540px]">
          <thead>
            <tr class="bg-theme-cardDark/80 border-b border-theme-primary/20 text-theme-muted text-xs uppercase tracking-wider font-semibold">
              <th scope="col" class="py-3.5 px-4 w-16 text-center">S.No</th>
              <th scope="col" class="py-3.5 px-4">Name</th>
              <th scope="col" class="py-3.5 px-4 w-28">Age</th>
              <th scope="col" class="py-3.5 px-4 w-36">Course</th>
              <th scope="col" class="py-3.5 px-4 text-center w-48">Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-theme-primary/10 text-theme-light">
            <!-- Dynamic rows inserted here -->
          </tbody>
        </table>
      </div>

      <!-- Pagination & Info footer -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2 text-xs text-theme-muted">
        <span id="paginationInfo">Showing 1 to 3 of 3 students</span>

        <div class="flex items-center space-x-1.5" id="paginationControls">
          <!-- Dynamic pagination buttons -->
        </div>
      </div>
    </section>
  </main>

  <!-- DELETE CONFIRMATION MODAL -->
  <div id="deleteModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
    <div class="glass-card bg-[#0e2137] border border-rose-500/40 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative text-center">
      <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 mx-auto flex items-center justify-center mb-4">
        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
      </div>
      <h4 class="text-lg font-bold text-white mb-2">Delete Student?</h4>
      <p class="text-xs text-theme-muted mb-6">Are you sure you want to remove <span id="deleteStudentName" class="text-white font-semibold"></span>? This action cannot be undone.</p>

      <div class="flex items-center justify-center space-x-3">
        <button type="button" onclick="closeDeleteModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-theme-light hover:bg-theme-card/60 transition">
          Cancel
        </button>
        <button id="confirmDeleteBtn" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold shadow-md transition">
          Yes, Delete
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION MESSAGE BOX -->
  <div id="toastNotification" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none flex items-center space-x-3 px-4 py-3 rounded-xl glass-card bg-[#142A44]/95 border border-theme-primary shadow-glow-primary text-xs text-white">
    <i class="fa-solid fa-circle-check text-theme-primary text-base" id="toastIcon"></i>
    <span id="toastMessage">Action completed successfully</span>
  </div>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    const STORAGE_KEY = 'student_management_records';

    // Load saved students from localStorage or initialize as empty array
    let students = loadStudentsFromStorage();

    function loadStudentsFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        console.error('Failed to load from localStorage', e);
        return [];
      }
    }

    function saveStudentsToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
      } catch (e) {
        console.error('Failed to save to localStorage', e);
      }
    }

    let isEditMode = false;
    let currentFilterCourse = 'ALL';
    let searchQuery = '';
    let currentPage = 1;
    const pageSize = 5;
    let studentPendingDeleteId = null;

    // DOM Elements
    const studentTableBody = document.getElementById('studentTableBody');
    const studentForm = document.getElementById('studentForm');
    const editingStudentIdInput = document.getElementById('editingStudentId');
    const studentNameInput = document.getElementById('studentName');
    const studentAgeInput = document.getElementById('studentAge');
    const studentCourseInput = document.getElementById('studentCourse');
    const formTitle = document.getElementById('formTitle');
    const formIcon = document.getElementById('formIcon');
    const defaultActionContainer = document.getElementById('defaultActionContainer');
    const editActionContainer = document.getElementById('editActionContainer');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const searchInput = document.getElementById('searchInput');
    const courseFilter = document.getElementById('courseFilter');
    const paginationInfo = document.getElementById('paginationInfo');
    const paginationControls = document.getElementById('paginationControls');

    // Initialize application
    document.addEventListener('DOMContentLoaded', () => {
      renderTable();
      setupEventListeners();
    });

    function setupEventListeners() {
      // Unified Form Submission (Add or Update)
      studentForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const nameVal = studentNameInput.value.trim();
        const ageVal = parseInt(studentAgeInput.value, 10);
        const courseVal = studentCourseInput.value;

        if (isEditMode) {
          const id = parseInt(editingStudentIdInput.value, 10);
          const student = students.find(s => s.id === id);
          if (student) {
            student.name = nameVal;
            student.age = ageVal;
            student.course = courseVal;
            saveStudentsToStorage();
            showNotification(`Updated details for "${student.name}"!`);
          }
          resetFormToAddMode();
        } else {
          const newStudent = {
            id: Date.now(),
            name: nameVal,
            age: ageVal,
            course: courseVal
          };
          students.unshift(newStudent);
          saveStudentsToStorage();
          showNotification(`Student "${newStudent.name}" added successfully!`);
          resetFormToAddMode();
          currentPage = 1;
        }

        renderTable();
      });

      // Cancel Edit button
      cancelEditBtn.addEventListener('click', () => {
        resetFormToAddMode();
        showNotification('Edit cancelled', 'info');
      });

      // Realtime search
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        currentPage = 1;
        renderTable();
      });

      // Course filter
      courseFilter.addEventListener('change', (e) => {
        currentFilterCourse = e.target.value;
        currentPage = 1;
        renderTable();
      });

      // Delete confirmation
      document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
        if (studentPendingDeleteId !== null) {
          const student = students.find(s => s.id === studentPendingDeleteId);
          const studentName = student ? student.name : 'Student';
          students = students.filter(s => s.id !== studentPendingDeleteId);
          saveStudentsToStorage();

          // If currently editing the deleted student, reset the form
          if (isEditMode && parseInt(editingStudentIdInput.value, 10) === studentPendingDeleteId) {
            resetFormToAddMode();
          }

          showNotification(`Removed ${studentName} from records.`, 'info');
          closeDeleteModal();
          studentPendingDeleteId = null;
          renderTable();
        }
      });
    }

    // Switch Form to Edit Mode and populate fields
    function startEditStudent(id) {
      const student = students.find(s => s.id === id);
      if (!student) return;

      isEditMode = true;
      editingStudentIdInput.value = student.id;
      studentNameInput.value = student.name;
      studentAgeInput.value = student.age;
      studentCourseInput.value = student.course;

      // Update Form Title and Icon
      formTitle.innerText = 'Edit Student Details';
      formIcon.className = 'fa-solid fa-pen-to-square text-sm text-theme-light';

      // Toggle buttons: Hide Submit, Show Update + Cancel
      defaultActionContainer.classList.add('hidden');
      editActionContainer.classList.remove('hidden');

      // Scroll smoothly to form and focus name input
      document.getElementById('formSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
      studentNameInput.focus();
    }

    // Revert form back to Add New Student mode
    function resetFormToAddMode() {
      isEditMode = false;
      editingStudentIdInput.value = '';
      studentNameInput.value = '';
      studentAgeInput.value = '';
      studentCourseInput.selectedIndex = 0;

      formTitle.innerText = 'Add New Student';
      formIcon.className = 'fa-solid fa-user-plus text-sm';

      defaultActionContainer.classList.remove('hidden');
      editActionContainer.classList.add('hidden');
    }

    // Filter & Paginate logic
    function getFilteredStudents() {
      return students.filter(student => {
        const matchesCourse = (currentFilterCourse === 'ALL' || student.course === currentFilterCourse);
        const matchesSearch = student.name.toLowerCase().includes(searchQuery) ||
                              student.course.toLowerCase().includes(searchQuery) ||
                              student.age.toString().includes(searchQuery);
        return matchesCourse && matchesSearch;
      });
    }

    function renderTable() {
      const filtered = getFilteredStudents();
      const total = filtered.length;
      const totalPages = Math.ceil(total / pageSize) || 1;

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const startIndex = (currentPage - 1) * pageSize;
      const paginatedData = filtered.slice(startIndex, startIndex + pageSize);

      studentTableBody.innerHTML = '';

      if (students.length === 0) {
        studentTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="py-14 text-center text-theme-muted">
              <i class="fa-solid fa-user-graduate text-3xl mb-3 opacity-40 block"></i>
              <p class="text-sm font-medium text-white mb-1">No students added yet</p>
              <span class="text-xs text-theme-muted">Enter a name, age, and course above and click "Submit" to add your first student.</span>
            </td>
          </tr>
        `;
      } else if (paginatedData.length === 0) {
        studentTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="py-12 text-center text-theme-muted">
              <i class="fa-solid fa-magnifying-glass text-2xl mb-2 opacity-50 block"></i>
              <span>No matching student records found for your filter.</span>
            </td>
          </tr>
        `;
      } else {
        paginatedData.forEach((student, index) => {
          const serialNo = startIndex + index + 1;
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-theme-card/40 transition-colors duration-150';

          tr.innerHTML = `
            <td class="py-3.5 px-4 text-center font-medium text-theme-muted">${serialNo}</td>
            <td class="py-3.5 px-4 font-semibold text-white">
              <div class="flex items-center space-x-2.5">
                <span class="w-7 h-7 rounded-lg bg-theme-primary/20 text-theme-light text-xs font-bold flex items-center justify-center border border-theme-primary/30">
                  ${getInitials(student.name)}
                </span>
                <span>${escapeHtml(student.name)}</span>
              </div>
            </td>
            <td class="py-3.5 px-4 text-theme-light">${student.age}</td>
            <td class="py-3.5 px-4">
              <span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-theme-primary/20 text-theme-light border border-theme-primary/40">
                ${escapeHtml(student.course)}
              </span>
            </td>
            <td class="py-3.5 px-4 text-center">
              <div class="inline-flex items-center justify-center space-x-2">
                <!-- Edit Button (Loads info into top form) -->
                <button 
                  onclick="startEditStudent(${student.id})" 
                  class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[#8d5b12]/60 hover:bg-amber-600 text-amber-200 border border-amber-500/40 transition-all flex items-center space-x-1.5 shadow-sm active:scale-95" 
                  title="Edit Student"
                >
                  <i class="fa-solid fa-pen text-[11px]"></i>
                  <span>Edit</span>
                </button>

                <!-- Delete Button -->
                <button 
                  onclick="openDeleteModal(${student.id})" 
                  class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[#7c1d27]/60 hover:bg-rose-700 text-rose-200 border border-rose-500/40 transition-all flex items-center space-x-1.5 shadow-sm active:scale-95" 
                  title="Delete Student"
                >
                  <i class="fa-regular fa-trash-can text-[11px]"></i>
                  <span>Delete</span>
                </button>
              </div>
            </td>
          `;
          studentTableBody.appendChild(tr);
        });
      }

      // Update Pagination Indicators
      const startDisplay = total === 0 ? 0 : startIndex + 1;
      const endDisplay = Math.min(startIndex + pageSize, total);
      paginationInfo.innerText = `Showing ${startDisplay} to ${endDisplay} of ${total} students`;

      renderPaginationControls(totalPages);
    }

    function renderPaginationControls(totalPages) {
      paginationControls.innerHTML = '';

      if (totalPages <= 1) return;

      // Prev Button
      const prevBtn = document.createElement('button');
      prevBtn.className = `w-8 h-8 rounded-lg glass-card flex items-center justify-center text-xs transition ${currentPage === 1 ? 'opacity-40 cursor-not-allowed' : 'hover:border-theme-primary text-white'}`;
      prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left text-[10px]"></i>';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
        }
      };
      paginationControls.appendChild(prevBtn);

      // Page numbers
      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        const isActive = i === currentPage;
        pageBtn.className = `w-8 h-8 rounded-lg text-xs font-bold transition ${isActive ? 'bg-theme-primary text-white shadow-glow-primary' : 'glass-card hover:bg-theme-card/80 text-theme-light'}`;
        pageBtn.innerText = i;
        pageBtn.onclick = () => {
          currentPage = i;
          renderTable();
        };
        paginationControls.appendChild(pageBtn);
      }

      // Next Button
      const nextBtn = document.createElement('button');
      nextBtn.className = `w-8 h-8 rounded-lg glass-card flex items-center justify-center text-xs transition ${currentPage === totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:border-theme-primary text-white'}`;
      nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right text-[10px]"></i>';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderTable();
        }
      };
      paginationControls.appendChild(nextBtn);
    }

    // Delete Modal controls
    function openDeleteModal(id) {
      const student = students.find(s => s.id === id);
      if (!student) return;

      studentPendingDeleteId = id;
      document.getElementById('deleteStudentName').innerText = student.name;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.add('hidden');
    }

    // Toast Notification helper
    let toastTimeout;
    function showNotification(message, type = 'success') {
      const toast = document.getElementById('toastNotification');
      const msgEl = document.getElementById('toastMessage');
      const iconEl = document.getElementById('toastIcon');

      msgEl.innerText = message;
      if (type === 'error') {
        iconEl.className = 'fa-solid fa-circle-exclamation text-rose-400 text-base';
      } else if (type === 'info') {
        iconEl.className = 'fa-solid fa-circle-info text-sky-400 text-base';
      } else {
        iconEl.className = 'fa-solid fa-circle-check text-theme-primary text-base';
      }

      clearTimeout(toastTimeout);
      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3000);
    }

    // Utilities
    function getInitials(name) {
      if (!name) return 'S';
      return name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function (m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }
  </script>
</body>
</html>
